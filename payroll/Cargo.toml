[package]
name = "hushush-payroll"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "hushush payroll engine: streams, server-side accrual, claim reservations (accounting only)"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }

# PostgreSQL backend
postgres = "0.19"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
