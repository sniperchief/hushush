[package]
name = "hushush-payroll-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Internal HTTP service exposing the hushush payroll engine (PostgreSQL) to the web app"

[dependencies]
hushush-payroll = { path = "../payroll" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
r2d2 = "0.8"
postgres = "0.19"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
