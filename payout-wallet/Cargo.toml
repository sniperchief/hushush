[package]
name = "hushush-payout-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "hushush payout wallet service: the only process holding spend authority (TESTNET ONLY)"

[features]
# Test-only crash points used by the live recovery test. Never enable in a
# deployed build.
fault-injection = []

[dependencies]
# The Phase 0 wallet proof, reused unchanged: wallet persistence, sync,
# shielded proposal/build/broadcast, secrets handling and the keyless observer.
hushush-wallet-proof = { path = "../wallet-proof" }

anyhow = "1"
axum = "0.8"
hex = "0.4"
rusqlite = { version = "0.37" }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tonic = "0.14"
tokio = { version = "1.21", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"

# Same exact pins as wallet-proof (NU7-capable pre-releases; see docs/PHASE0_REPORT.md).
orchard = { version = "=0.16.0", default-features = false }
sapling = { package = "sapling-crypto", version = "=0.9.0" }
zcash_client_backend = { version = "=0.25.0-pre.1", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "sync"] }
zcash_client_sqlite = { version = "=0.23.0-pre.1", features = ["orchard"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard", "sapling"] }
zcash_primitives = "=0.31.0-pre.1"
zcash_protocol = "=0.11.0-pre.0"

[dev-dependencies]
tempfile = "3"
zcash_address = "=0.14.0-pre.1"
zip32 = "=0.3.0"

# Zero-knowledge proving is unusably slow without optimisation.
[profile.dev.package."*"]
opt-level = 3
